<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Área interior</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="main-content">
    <div class="interior">
      <h1>Bienvenido</h1>
      <p>Has entrado al área interior. Contenido básico de ejemplo.</p>

      <section class="pokemon-section" aria-labelledby="pokemon-title">
        <h2 id="pokemon-title">Pokémon (PokeAPI)</h2>
        <div class="pokemon-filters">
          <input type="text" id="filter-id" placeholder="ID" title="Filtrar por ID">
          <input type="text" id="filter-nombre" placeholder="Nombre" title="Filtrar por nombre">
          <select id="filter-tipo" title="Filtrar por tipo">
            <option value="">Todos los tipos</option>
          </select>
        </div>
        <div id="pokemon-grid" class="pokemon-grid">
          <p class="pokemon-loading">Cargando…</p>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/auth.js"></script>
  <script src="js/layout-inner.js"></script>
  <script src="js/pokemon.js"></script>
</body>
</html>
